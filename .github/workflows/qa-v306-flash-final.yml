name: Reportes HYS v306 — Flash y Final Report
on:
  push:
    branches:
      - desarrollo/v306-flash-final-formularios
    paths:
      - 'v306-review/**'
      - 'evidencias-v306/**'
      - '.github/workflows/qa-v306-flash-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flash-final-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar DOM para validación
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Dos tarjetas y formularios v306
        run: node evidencias-v306/test-flash-final-v306.cjs
      - name: Pestaña Administrador General v305
        run: node evidencias-v305/test-investigacion-admin-v305.cjs
      - name: Pilares integrados v304
        run: node evidencias-v304/test-interfaz-integrada-v304.cjs
      - name: Períodos y alertas v303
        run: node evidencias-v303/test-periodos-indicadores-v303.cjs
      - name: Auditoría integral v302
        run: node evidencias-v302/test-auditoria-integral-v302.cjs
      - name: Permisos rápidos v301
        run: node evidencias-v301/test-gestion-rapida-v301.cjs
      - name: Roles e interfaz v300
        run: node evidencias-v300/test-interfaz-permisos-v300.cjs
      - name: Lectura central v299
        run: node evidencias-v299/test-lectura-remota-v299.cjs
      - name: Lectura autenticada v298
        run: node evidencias-v298/test-lectura-central-v298.cjs
      - name: Acuses v297
        run: node evidencias-v297/test-acuses-trazabilidad-v297.cjs
      - name: Integridad v296
        run: node evidencias-v296/test-integridad-auditoria-v296.cjs
      - name: Recuperación v295
        run: node evidencias-v295/test-recuperaciones-v295.cjs
      - name: Historial v294
        run: node evidencias-v294/test-validacion-dos-modulos-v294.cjs
      - name: PDF y fotos v293
        run: node evidencias-v293/test-archivo-evidencias-v293.cjs
      - name: Contrato guardado v292
        run: node evidencias-v292/test-contrato-guardado-v292.cjs
      - name: Seguridad v291
        run: node evidencias-v291/test-seguridad-y-guardado-v291.cjs
      - name: Riesgos v290
        run: node evidencias-v290/test-riesgos-v290.cjs
      - name: DOM y seguridad v289
        run: node evidencias-v289/test-consolidacion-v289.cjs
      - name: Guardado local v284
        run: node evidencias-v284/test-regresion-v284.cjs
