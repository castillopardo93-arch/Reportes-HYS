name: QA integración interfaz real v287
on:
  push:
    branches:
      - desarrollo/v287-integracion-pilares-interfaz
    paths:
      - 'v287-review/**'
      - 'evidencias-v287/**'
      - '.github/workflows/qa-v287-interfaz.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de validación DOM
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Interfaz real y seguridad de la nueva tarjeta
        run: node evidencias-v287/test-integracion-v287.cjs
      - name: Regresiones de almacenamiento y formularios
        run: node evidencias-v284/test-regresion-v284.cjs
