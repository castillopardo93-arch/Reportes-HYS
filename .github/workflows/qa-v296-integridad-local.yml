name: Auditoria local integral HYS v296
on:
  push:
    branches:
      - desarrollo/v296-integridad-local-documental
    paths:
      - 'v296-review/**'
      - 'evidencias-v296/**'
      - '.github/workflows/qa-v296-integridad-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Instalar DOM aislado sin scripts externos
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Auditoria y protecciones locales v296
        run: node evidencias-v296/test-integridad-auditoria-v296.cjs
      - name: Recuperaciones v295
        run: node evidencias-v295/test-recuperaciones-v295.cjs
      - name: Historial y PDF v294
        run: node evidencias-v294/test-validacion-dos-modulos-v294.cjs
      - name: Fotos y evidencias v293
        run: node evidencias-v293/test-archivo-evidencias-v293.cjs
      - name: Sincronizacion v292
        run: node evidencias-v292/test-contrato-guardado-v292.cjs
      - name: Facultades y permisos v291
        run: node evidencias-v291/test-seguridad-y-guardado-v291.cjs
      - name: Catalogo de riesgos v290
        run: node evidencias-v290/test-riesgos-v290.cjs
      - name: Regresion integral v289
        run: node evidencias-v289/test-consolidacion-v289.cjs
      - name: Regresion de almacenamiento v284
        run: node evidencias-v284/test-regresion-v284.cjs
