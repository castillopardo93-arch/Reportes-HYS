name: Reportes HYS v311 — Investigación y trazabilidad (laboratorio)
on:
  push:
    branches:
      - desarrollo/v311-auditoria-correcciones
    paths:
      - 'v311-review/**'
      - 'evidencias-v311/**'
      - '.github/workflows/qa-v311-investigacion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar entorno DOM
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Verificar sintaxis del extractor oficial Excel
        run: python3 -m py_compile evidencias-v311/extraer-causas-desde-excel.py
      - name: Integración de interfaz avanzada y ausencia de regresiones en módulos base
        run: node evidencias-v311/test-interfaz-avanzada-v310.cjs
      - name: Auditoría de fechas imposibles, Final incompleto y correcciones pendientes
        run: node evidencias-v311/test-integridad-investigacion-v311.cjs
      - name: Ensayo de Flash, Final y seguimiento
        run: node evidencias-v311/test-flujo-v308.cjs
      - name: Dos opciones de cierre dentro de las facultades originales (sin panel adicional)
        run: node evidencias-v311/test-facultades-lista-v310.cjs
      - name: Directorio seguro y búsqueda inteligente de revisores
        run: node evidencias-v311/test-revisores-v308.cjs
      - name: Verificar cada causa en su categoría de Final Report y acceso directo
        run: node evidencias-v311/test-causas-ubicacion-v308.cjs
      - name: Catálogo Excel — Código y nombre (153 opciones)
        run: node evidencias-v311/test-catalogo-v308.cjs
      - name: Regresión de formularios originales
        run: node evidencias-v306/test-flash-final-v306.cjs
